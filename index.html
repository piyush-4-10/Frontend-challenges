<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TechMart – Smart Price Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">TechMart Product Explorer</p>
      <h1>Smart Price Finder</h1>
      <p class="sub">Find products closest to your budget, or browse everything inside a price range.</p>
    </div>
  </header>

  <main class="container">
    <section class="panels">
      <div class="panel">
        <h2>🎯 Closest to a price</h2>
        <div class="field-row">
          <div class="input-wrap"><span>₹</span>
            <input id="targetPrice" type="number" min="0" placeholder="70000" />
          </div>
          <button id="searchBtn">Search</button>
        </div>
      </div>

      <div class="panel">
        <h2>↔️ Within a range</h2>
        <div class="field-row">
          <div class="input-wrap"><span>₹</span>
            <input id="minPrice" type="number" min="0" placeholder="Min 50000" />
          </div>
          <span class="to">to</span>
          <div class="input-wrap"><span>₹</span>
            <input id="maxPrice" type="number" min="0" placeholder="Max 80000" />
          </div>
          <button id="rangeBtn">Find in range</button>
        </div>
      </div>
    </section>

    <p id="message" class="message"></p>

    <div id="resultHead" class="result-head hidden">
      <h2 id="resultTitle"></h2>
      <span id="resultCount" class="badge"></span>
    </div>
    <div id="results" class="grid"></div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="modalClose" class="modal-close" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
